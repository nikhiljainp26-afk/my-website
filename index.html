function site(){const b=cfg.biz,ta=cfg.ta||{},P=(e,x)=>L=="ta"&&x?x:e,v=vis();
document.title=b.name+" – Crompton fans wholesale";$("bn").textContent=b.name;
const tg=P(b.tag,ta.tag),m=tg.match(/^(.*?[.!?।])\s+(.*)$/);$("tg").innerHTML=m?esc(m[1])+' <span class="gold">'+esc(m[2])+"</span>":esc(tg);$("sb").textContent=P(b.sub,ta.sub);
const bn=cfg.banner||{},bt=P(bn.text,ta.banner);$("ann").hidden=!(bn.on&&bt);$("annt").textContent=bt||"";
$("ft").textContent="© "+new Date().getFullYear()+" "+b.name+" · "+t("foot");
$("st1").textContent=v.length;$("st2").textContent=v.reduce((s,x)=>s+(cols(x).length||+x.c||0),0);
{const R=(cfg.reviews||[]).filter(r=>r.q);$("rev").hidden=!R.length;$("rv").innerHTML=R.map(r=>`<div class="f rv"><p>“${esc(r.q)}”</p><h3 style="font-size:16px;margin-top:14px">${esc(r.n||"")}</h3><small>${esc(r.w||"")}</small></div>`).join("")}
$("pk").innerHTML=cfg.perks.map((p,i)=>{const q=(ta.perks||[])[i]||{};return `<div class="f"><i>0${i+1}</i><h3>${esc(P(p.t,q.t))}</h3><p>${esc(P(p.d,q.d))}</p></div>`}).join("");
const d=ph.length==12&&ph.startsWith("91")?"+91 "+ph.slice(2,7)+" "+ph.slice(7):ph,w="https://wa.me/"+ph+"?text="+encodeURIComponent("Hello "+b.name+", I'd like to enquire about Crompton fans.");
$("cw").href=okp?w:"#contact";$("fab").href=okp?w:"#contact";if(!okp)$("fab").style.display="none";
$("ci").innerHTML=(okp?`<div><b>${t("c_ph")}</b><a href="tel:+${ph}">${d}</a></div>`:"")+(b.addr?`<div><b>${t("c_visit")}</b>${esc(b.addr)}</div>`:"")+(b.hours?`<div><b>${t("c_hours")}</b>${esc(b.hours)}</div>`:"")}
function chips(){$("chips").innerHTML=["All","Ceiling","Table","Pedestal","Wall"].map(c=>`<button class="tab" aria-pressed="${c==ft}" data-c="${c}">${t("T_"+c)}</button>`).join("")}
function grid(){const T=tr(),tf=$("tf").value,so=$("so").value,q=$("q").value.toLowerCase().trim(),l=vis().filter(i=>(ft=="All"||TN[i.t]==ft)&&(!tf||tier(i.p,T)==tf)&&(i.n+" "+TN[i.t]).toLowerCase().includes(q)).sort(so=="pd"?(a,b)=>b.p-a.p:so=="n"?(a,b)=>a.n.localeCompare(b.n):(a,b)=>a.p-b.p);
$("g").innerHTML=l.length?l.map(i=>{const k=cols(i),n=k.length||i.c,h0=k.length?sh(k[0]):["#9aa8b4"];
return `<div class="card" data-col="${esc(k[0]||"")}" style="--c:${h0[0]}"><div class="band"><span>${t("T_"+TN[i.t])}</span><span class="tr">${t("tier_"+tier(i.p,T))}</span></div><div class="cb"><h3>${esc(i.n)}</h3><div class="cn"><span class="cnm">${esc(k[0]||"")}</span>${k.length?" · ":""}${n} ${n>1?t("coloursw"):t("colour")}</div>${k.length>1?`<div class="sws">${k.map((c,j)=>{const h=sh(c);return `<button class="sw" aria-pressed="${j==0}" data-col="${esc(c)}" data-hex="${h[0]}" title="${esc(c)}" aria-label="${esc(c)}" style="--s:${h[0]};${h[1]?`background:linear-gradient(135deg,${h[0]} 50%,${h[1]} 50%)`:""}"></button>`}).join("")}</div>`:""}<div class="p"><small>${t("from")} </small>${inr(i.p)} <small>${t("gst")}</small></div><div class="pick"><input type="number" min="1" max="100" value="1" aria-label="Quantity"><button class="btn" data-id="${i.id}">${t("add")}</button></div></div></div>`}).join(""):`<div class="none">${t("nomatch")}</div>`}
const who=()=>[$("c_name").value,$("c_shop").value,$("c_town").value].map(x=>x.trim()).filter(Boolean).join(", ");
function wa(){const k=Object.keys(cart),v=vis();if(!k.length)return null;if(!okp)return{err:1};
const x=cfg.biz.name,tx="Hi "+x+", I'd like a wholesale quote:\n"+k.map(y=>{const[id,col]=y.split("|"),i=v.find(z=>z.id==id);return i?"- "+i.n+" ("+TN[i.t]+")"+(col?", "+col:"")+" x "+cart[y]:""}).join("\n")+(who()?"\nFrom: "+who():"")+"\nPlease share your rate and delivery time.";
return{t:tx,u:"https://wa.me/"+ph+"?text="+encodeURIComponent(tx)}}
function list(){const k=Object.keys(cart),v=vis(),last=ls("fan_last");$("cnt").textContent=k.reduce((s,x)=>s+cart[x],0);
$("items").innerHTML=k.length?k.map(x=>{const[id,col]=x.split("|"),i=v.find(y=>y.id==id);return i?`<div class="rw"><span>${esc(i.n)} <small>(${t("T_"+TN[i.t])}${col?", "+esc(col):""})</small></span><span class="q"><input type="number" min="1" max="100" value="${cart[x]}" data-k="${esc(x)}" aria-label="Quantity"><button data-d="${esc(x)}" aria-label="Remove">✕</button></span></div>`:""}).join(""):`<div class="none">${t("empty")}</div>`+(last&&last.length?`<button class="btn g" id="rl">${t("reorder")}</button>`:"");
const o=wa();$("send").href=o&&!o.err?o.u:"#"}
function pmsg(){const g=i=>$(i).value.trim(),n=+g("p_qty");
const tx="Project quote request from "+g("p_name")+(g("p_co")?" ("+g("p_co")+")":"")+"\nLocation: "+g("p_loc")+"\nFans needed: "+n+" ("+g("p_type")+")"+(g("p_note")?"\nNotes: "+g("p_note"):"")+"\nPlease send a quote.";
return{ok:g("p_name")&&g("p_loc")&&n>0&&okp,t:tx,u:"https://wa.me/"+ph+"?text="+encodeURIComponent(tx)}}
function applyLang(){document.documentElement.lang=L;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
$("l_en").setAttribute("aria-pressed",L=="en");$("l_ta").setAttribute("aria-pressed",L=="ta");site();chips();grid();list();$("p_send").href=pmsg().u}
$("l_en").onclick=()=>{L="en";ls("fan_lang","en");applyLang()};$("l_ta").onclick=()=>{L="ta";ls("fan_lang","ta");applyLang()};
$("chips").onclick=e=>{if(e.target.dataset.c){ft=e.target.dataset.c;chips();grid()}};$("q").oninput=grid;$("so").onchange=grid;$("tf").onchange=grid;
["c_name","c_shop","c_town"].forEach(i=>$(i).oninput=()=>{ls("fan_who",{n:$("c_name").value,s:$("c_shop").value,t:$("c_town").value});list()});
["p_name","p_co","p_loc","p_qty","p_type","p_note"].forEach(i=>$(i).oninput=()=>{$("p_send").href=pmsg().u});
$("p_send").onclick=e=>{if(!pmsg().ok){e.preventDefault();$("p_msg").textContent=t("pr_need")}else $("p_msg").textContent=""};
$("g").onclick=e=>{const sw=e.target.closest(".sw");if(sw){const c=sw.closest(".card");c.dataset.col=sw.dataset.col;c.style.setProperty("--c",sw.dataset.hex);c.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b===sw));c.querySelector(".cnm").textContent=sw.dataset.col;return}
const id=e.target.dataset.id;if(!id)return;const c=e.target.closest(".card"),q=clamp(c.querySelector(".pick input").value),k=id+"|"+(c.dataset.col||"");cart[k]=Math.min(100,(cart[k]||0)+q);list();$("dr").classList.add("open");$("msg").textContent=t("m_add").replace("{n}",q)};
$("items").onclick=e=>{const d=e.target.dataset.d;if(d){delete cart[d];list()}if(e.target.id=="rl"){const v=vis();(ls("fan_last")||[]).forEach(([n,ty,col,q])=>{const i=v.find(x=>x.n==n&&x.t==ty);if(i){const k=i.id+"|"+col;cart[k]=Math.min(100,(cart[k]||0)+clamp(q))}});list()}};
$("items").onchange=e=>{const k=e.target.dataset.k;if(k){cart[k]=clamp(e.target.value);list()}};
const op=()=>{$("dr").classList.add("open");$("msg").textContent="";list()};$("open").onclick=op;$("close").onclick=()=>$("dr").classList.remove("open");
$("send").onclick=e=>{const o=wa();if(!o){e.preventDefault();$("msg").textContent=t("m_none")}else if(o.err){e.preventDefault();$("msg").textContent=t("m_off")}else if(!$("c_name").value.trim()){e.preventDefault();$("msg").textContent=t("m_name")}else{const v=vis();ls("fan_last",Object.keys(cart).map(x=>{const[id,col]=x.split("|"),i=v.find(y=>y.id==id);return i?[i.n,i.t,col,cart[x]]:null}).filter(Boolean));$("msg").textContent=t("m_open")+ph+"."}};
$("copy").onclick=async()=>{const o=wa();if(!o||o.err){$("msg").textContent=t("m_none");return}try{await navigator.clipboard.writeText(o.t);$("msg").textContent=t("m_copied")}catch(x){window.prompt("Copy this order text:",o.t)}};
{const w=ls("fan_who")||{};$("c_name").value=w.n||"";$("c_shop").value=w.s||"";$("c_town").value=w.t||"";$("p_name").value=w.n||"";$("p_loc").value=w.t||""}
applyLang();
</script></body></html>
